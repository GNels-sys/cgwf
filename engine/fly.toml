# Fly app for the rules engine. Separate app from "cgwf" so the Java service can be sized,
# deployed and rolled back on its own. Deploy from this folder:
#   fly deploy --remote-only --ha=false
#
# The engine has NO public port: the CGwF server reaches it over Fly's private network at
# ws://cgwf-engine.internal:8081 (same organisation), with the ENGINE_TOKEN secret on both apps.
# Games live in RAM only, so the machine must stay up while tables can be open (Stage 1: always on;
# no [[services]] block means Fly never auto-stops it).
app = "cgwf-engine"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"
  CGWF_LAZY_CARDS = "true"
  CGWF_PROMPT_TIMEOUT_MS = "600000"
  CGWF_MAX_GAMES = "4"

# Memory is plenty at 2 GB (a game peaks under 600 MB RSS). CPU is what Forge's AI needs: on
# shared-cpu-2x an AI-only game ran ~7x slower than on the dev box, performance-1x within 1.6x
# (README "Measurements"). Stage 1 plays humans only, so the cheap size stays; when bots are used:
#   fly machine update <id> -a cgwf-engine --vm-size performance-1x --vm-memory 2048 --yes
# No public service means Fly never auto-starts the machine; "always" keeps it up after crashes
# and host maintenance. Start it by hand after the very first deploy: fly machine start <id>.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
